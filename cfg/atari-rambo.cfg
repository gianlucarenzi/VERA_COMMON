# atari-rambo.cfg - libvera: the cc65 atari.cfg plus the segments of the RMT
# player (RMTZP zero page, RMTTAB / PSGTAB page aligned tables), a first
# load chunk that switches the BASIC ROM off (src/atari/basicoff.s) and the
# RAMbo 256K of the VERA board (src/atari/sdbank.s).  ZP $82-$FF is all
# cc65's: libvera's zero page fits in it.  Needed by the FAT32 code
# (libvera_sd.lib: LIBVERA_RAMBO = 1, mk/libvera.mk); a program without it
# can use atari.cfg, $2400-$BC1F in one piece.
#
# Memory (the OS stays on: VBI and IRQs run all the time):
#   %S-$3FFF   LOW: LOWRODATA (e.g. the song: rmt2ca65.py), then XBSS
#              (large RAM buffers, not zeroed: cx16.cfg)
#   $4000-7FFF WIN: the window of the RAMbo banks.  In the main RAM the
#              GAMECODE / GAMERODATA segments: code and tables of the
#              program that no interrupt uses and that are not handed to
#              the SD functions (the bank of the FAT32 code is in during
#              those calls).  In a RAMbo bank (BANK): the FAT32 code.
#   $8000-$BC1F MAIN: everything else, the C stack at the top; under the
#              BASIC ROM, switched off by basicoff.s.
#   $CC00-$CFFF OSRAM (optional): the international character set of the
#              XL OS, unused; once the OS runs from RAM (os_ram(), plat.h)
#              an OVERLAY can live there: the OSCODE segment is written to
#              its own file %O.osr (raw, run at $CC00), the program loads
#              it after os_ram() (asset_load to $CC00).  Not $D800-$DFFF:
#              the PBI ROM of the VERA board covers it while the OS serves
#              the board (its IRQ), code there would vanish under the CPU.
FEATURES {
    STARTADDRESS: default = $2000;
}
SYMBOLS {
    __EXEHDR__:          type = import;
    __BASIC_OFF__:       type = import;  # BASIC ROM off before anything else loads
    __SYSTEM_CHECK__:    type = import;  # force inclusion of "system check" load chunk
    __XEX_CHUNKS__:      type = import;  # load chunks of WIN and LOW (xexchunks.s)
    __AUTOSTART__:       type = import;  # force inclusion of autostart "trailer"
    __STACKSIZE__:       type = weak, value = $0800; # 2k stack
    __STARTADDRESS__:    type = export, value = %S;
    __ATARI_RAMBO_CFG__: type = export, value = 1;  # sdbank.s links only with this cfg
    __RESERVED_MEMORY__: type = weak, value = $0000;
}
MEMORY {
    ZP:         file = "", define = yes, start = $0082, size = $007E;

# file header, just $FFFF
    HEADER:     file = %O,               start = $0000, size = $0002;

# "BASIC off" load chunk (basicoff.s), run before the system check
    BASOFFHDR:  file = %O,               start = $0000, size = $0004;
    BASOFFCHNK: file = %O,               start = $2E00, size = $0100;
    BASOFFTRL:  file = %O,               start = $0000, size = $0006;

# "system check" load chunk
    SYSCHKHDR:  file = %O,               start = $0000, size = $0004;
    SYSCHKCHNK: file = %O,               start = $2E00, size = $0300;
    SYSCHKTRL:  file = %O,               start = $0000, size = $0006;

# the FAT32 code in its RAMbo bank (sdbank.s, only with libvera_sd.lib):
# bank in, BANK, bank out
    BANKONHDR:  file = %O,               start = $0000, size = $0004;
    BANKONCHNK: file = %O,               start = $2E00, size = $0080;
    BANKONTRL:  file = %O,               start = $0000, size = $0006;
    BANKHDR:    file = %O,               start = $0000, size = $0004;
    BANK:       file = %O, define = yes, start = $4000, size = $4000;
    BANKOFFHDR: file = %O,               start = $0000, size = $0004;
    BANKOFFCHNK: file = %O,              start = $2E80, size = $0080;
    BANKOFFTRL: file = %O,               start = $0000, size = $0006;

# the window in the main RAM, the RAM below it (xexchunks.s)
    WINHDR:     file = %O,               start = $0000, size = $0004;
    WIN:        file = %O, define = yes, start = $4000, size = $4000;
    LOWHDR:     file = %O,               start = $0000, size = $0004;
    LOW:        file = %O, define = yes, start = %S,    size = $4000 - %S;

# "main program" load chunk
    MAINHDR:    file = %O,               start = $0000, size = $0004;
    MAIN:       file = %O, define = yes, start = $8000, size = $BC20 - __STACKSIZE__ - __RESERVED_MEMORY__ - $8000;
    TRAILER:    file = %O,               start = $0000, size = $0006;
    OSRAM:      file = "%O.osr",         start = $CC00, size = $0400;
}
SEGMENTS {
    ZEROPAGE:  load = ZP,         type = zp;
    RMTZP:     load = ZP,         type = zp,                optional = yes;
    EXTZP:     load = ZP,         type = zp,                optional = yes;
    EXEHDR:    load = HEADER,     type = ro;
    BASOFFHDR: load = BASOFFHDR,  type = ro;
    BASOFF:    load = BASOFFCHNK, type = rw,  define = yes;
    BASOFFTRL: load = BASOFFTRL,  type = ro;
    SYSCHKHDR: load = SYSCHKHDR,  type = ro,                optional = yes;
    SYSCHK:    load = SYSCHKCHNK, type = rw,  define = yes, optional = yes;
    SYSCHKTRL: load = SYSCHKTRL,  type = ro,                optional = yes;
    BANKONHDR: load = BANKONHDR,  type = ro,                optional = yes;
    BANKON:    load = BANKONCHNK, type = rw,  define = yes, optional = yes;
    BANKONTRL: load = BANKONTRL,  type = ro,                optional = yes;
    BANKHDR:   load = BANKHDR,    type = ro,                optional = yes;
    BANKCODE:  load = BANK,       type = ro,  define = yes, optional = yes;
    BANKBSS:   load = BANK,       type = bss, define = yes, optional = yes;
    BANKOFFHDR: load = BANKOFFHDR, type = ro,               optional = yes;
    BANKOFF:   load = BANKOFFCHNK, type = rw, define = yes, optional = yes;
    BANKOFFTRL: load = BANKOFFTRL, type = ro,               optional = yes;
    WINHDR:    load = WINHDR,     type = ro;
    WINPAD:    load = WIN,        type = ro;
    GAMECODE:  load = WIN,        type = ro,                optional = yes;
    GAMERODATA: load = WIN,       type = ro,                optional = yes;
    LOWHDR:    load = LOWHDR,     type = ro;
    LOWPAD:    load = LOW,        type = ro;
    LOWRODATA: load = LOW,        type = ro,                optional = yes;
    LOWEND:    load = LOW,        type = ro,  define = yes;
    XBSS:      load = LOW,        type = bss, define = yes, optional = yes;
    MAINHDR:   load = MAINHDR,    type = ro;
    STARTUP:   load = MAIN,       type = ro,  define = yes;
    LOWBSS:    load = MAIN,       type = rw,                optional = yes;  # not zero initialized
    LOWCODE:   load = MAIN,       type = ro,  define = yes, optional = yes;
    ONCE:      load = MAIN,       type = ro,                optional = yes;
    OSCODE:    load = OSRAM,      type = ro,  define = yes, optional = yes;
    CODE:      load = MAIN,       type = ro,  define = yes;
    RODATA:    load = MAIN,       type = ro;
    RMTTAB:    load = MAIN,       type = ro,  align = $100, optional = yes;
    PSGTAB:    load = MAIN,       type = ro,  align = $100, optional = yes;
    DATA:      load = MAIN,       type = rw;
    INIT:      load = MAIN,       type = bss, define = yes, optional = yes;
    BSS:       load = MAIN,       type = bss, define = yes;
    AUTOSTRT:  load = TRAILER,    type = ro;
}
FEATURES {
    CONDES: type    = constructor,
            label   = __CONSTRUCTOR_TABLE__,
            count   = __CONSTRUCTOR_COUNT__,
            segment = ONCE;
    CONDES: type    = destructor,
            label   = __DESTRUCTOR_TABLE__,
            count   = __DESTRUCTOR_COUNT__,
            segment = RODATA;
    CONDES: type    = interruptor,
            label   = __INTERRUPTOR_TABLE__,
            count   = __INTERRUPTOR_COUNT__,
            segment = RODATA,
            import  = __CALLIRQ__;
}
