# apple2.cfg - libvera on the Apple IIe: a raw program at $0900 booted from a
# Disk II floppy by the a2emu-vera SDK boot sector (a2fs mkimage), no DOS.
# The data come from the microSD (libvera_sd.lib), so there is no RWTS buffer:
# the program runs up to $BF00 (pass the same HIMEM to a2fs mkimage --himem):
# page $BF stays free, cc65's crt0 reads $BF00 / $BF6F to look for ProDOS.
#
# Zero page $50-$FF: Applesoft's area (no BASIC runs); $20-$4F stay the
# Monitor's (text window, CH/CV/BASL for cc65 conio's VTABZ, $45 = A in the
# IRQ entry, plat.inc).
#
# Language card RAM: cc65's crt0 leaves it as $C080 (bank 2 READ, write
# protected) and cc65 conio sets $C080 again after every ROM call (VTABZ,
# home): only what is never written goes there.  LC ($D000-$FFF9: bank 2 and
# the 8 KB above it) holds the segments run there, copied by crt0 from right
# after ONCE: GAMECODE (the game code no interrupt runs, as in the Atari's
# RAMbo window), LCCODE, LCRODATA.  They must not be used while conio has
# the ROM in: IRQ code and its data stay in the main RAM.  XBSS (the large RAM buffers, not zeroed at startup:
# cx16.cfg) is in the main RAM, after BSS.
FEATURES {
    STARTADDRESS: default = $0900;
}
SYMBOLS {
    __STACKSIZE__: type = weak, value = $0800; # 2k stack
    __HIMEM__:     type = weak, value = $BF00;
}
MEMORY {
    ZP:     file = "", define = yes, start = $0050,        size = $00B0;
    MAIN:   file = %O, define = yes, start = %S,           size = __HIMEM__ - %S;
    BSS:    file = "",               start = __ONCE_RUN__, size = __HIMEM__ - __STACKSIZE__ - __ONCE_RUN__;
    LC:     file = "", define = yes, start = $D000,        size = $2FFA;
}
SEGMENTS {
    ZEROPAGE: load = ZP,             type = zp;
    RMTZP:    load = ZP,             type = zp,  optional = yes;
    STARTUP:  load = MAIN,           type = ro;
    LOWCODE:  load = MAIN,           type = ro,  optional = yes;
    CODE:     load = MAIN,           type = ro;
    RODATA:   load = MAIN,           type = ro;
    GAMERODATA: load = MAIN,         type = ro,  optional = yes;
    LOWRODATA: load = MAIN,          type = ro,  optional = yes; # atari-rambo.cfg: below $4000
    RMTTAB:   load = MAIN,           type = ro,  align = $100, optional = yes;
    PSGTAB:   load = MAIN,           type = ro,  align = $100, optional = yes;
    DATA:     load = MAIN,           type = rw;
    INIT:     load = MAIN,           type = rw;  # uninitialized, but reserves output space
    ONCE:     load = MAIN,           type = ro,  define   = yes;
    GAMECODE: load = MAIN, run = LC, type = ro,  optional = yes; # right after ONCE (crt0)
    LCCODE:   load = MAIN, run = LC, type = ro,  optional = yes;
    LCRODATA: load = MAIN, run = LC, type = ro,  optional = yes;
    BSS:      load = BSS,            type = bss, define   = yes;
    XBSS:     load = BSS,            type = bss, define   = yes, optional = yes;
}
FEATURES {
    CONDES: type    = constructor,
            label   = __CONSTRUCTOR_TABLE__,
            count   = __CONSTRUCTOR_COUNT__,
            segment = ONCE;
    CONDES: type    = destructor,
            label   = __DESTRUCTOR_TABLE__,
            count   = __DESTRUCTOR_COUNT__,
            segment = RODATA;
    CONDES: type    = interruptor,
            label   = __INTERRUPTOR_TABLE__,
            count   = __INTERRUPTOR_COUNT__,
            segment = RODATA,
            import  = __CALLIRQ__;
}
