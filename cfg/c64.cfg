# c64.cfg - libvera: the cc65 c64.cfg plus the segments of the RMT player
# (RMTZP zero page, RMTTAB / PSGTAB page aligned tables), and the zero page
# grown from $02-$1B to $02-$8F: the BASIC area.  plat_c64.s saves $1C-$8F
# at start-up and gives it back at exit, so BASIC finds its pointers again.
# XBSS (the large RAM buffers, not zeroed at startup: cx16.cfg) after BSS.
# COLL (4 KB under the C stack): the COLLBSS segment, a buffer that only
# fills after start-up (RastanRIP: the collision ring); BOOTOVL is the same
# RAM for the code used only at start-up (BOOTCODE / BOOTRODATA), written to
# its own file %O.boo: the program loads it there, runs it, then the buffer
# takes the RAM back.
# GEOPG0 .. GEOPG8 (optional): code for one 256 B GeoRAM page each, run in
# the window at $DE00 with the I/O on; it travels in the boot overlay
# (load = BOOTOVL) and the program copies it to its page at start-up.
# KHOVL0 / KHOVL1 (optional): code overlays per area right after KHIRO in
# the same RAM (areas KHO0 / KHO1, files %O.ko0 / %O.ko1).
# KHIRO (optional): read-only data for the RAM under the I/O at
# $D000-$DFFF, written to its own file %O.khi (raw): the program writes it
# there and reads it with all RAM visible ($01 = $34, IRQs off).  Not under
# the KERNAL: the boot loader's title shows its charsets from $E000-$FFFF
# while the game loads, and the VIC never sees $D000-$DFFF RAM in bank 3.
FEATURES {
    STARTADDRESS: default = $0801;
}
SYMBOLS {
    __LOADADDR__:  type = import;
    __EXEHDR__:    type = import;
    __VERA_SELECT__: type = import;   # plat_c64.s: the VERA latch $DFFD, ZP save
    __STACKSIZE__: type = weak, value = $0800; # 2k stack
    __HIMEM__:     type = weak, value = $D000;
    __KHMSIZE__:   type = weak, value = 0;      # KHM0 / KHM1: bytes of the main RAM per area
}
MEMORY {
    ZP:       file = "", define = yes, start = $0002,           size = $008E;
    LOADADDR: file = %O,               start = %S - 2,          size = $0002;
    HEADER:   file = %O, define = yes, start = %S,              size = $000D;
    MAIN:     file = %O, define = yes, start = __HEADER_LAST__, size = __HIMEM__ - __HEADER_LAST__;
    # overlays per area in the main RAM too (KHMAIN0 / KHMAIN1, files %O.km0 /
    # %O.km1, __KHMSIZE__ bytes from where ONCE runs, BSS after them): the
    # program loads them with the KHO one of its area (RastanRIP ovlc64.s,
    # ovlapple.s: after startup, so ONCE's RAM is free again)
    KHM0:   file = "%O.km0", define = yes, start = __ONCE_RUN__, size = __KHMSIZE__;
    KHM1:   file = "%O.km1", define = yes, start = __ONCE_RUN__, size = __KHMSIZE__;
    BSS:      file = "",               start = __ONCE_RUN__ + __KHMSIZE__,    size = __HIMEM__ - __STACKSIZE__ - $1000 - __ONCE_RUN__ - __KHMSIZE__;
    COLL:     file = "",       define = yes, start = __HIMEM__ - __STACKSIZE__ - $1000, size = $1000;
    BOOTOVL:  file = "%O.boo", define = yes, start = __HIMEM__ - __STACKSIZE__ - $1000, size = $1000;
    # GeoRAM pages (window $DE00-$DEFF): code that runs there, stored in
    # the boot overlay and copied into GeoRAM at start-up by the program
    GEO0:     file = "",               start = $DE00,           size = $0100;
    GEO1:     file = "",               start = $DE00,           size = $0100;
    GEO2:     file = "",               start = $DE00,           size = $0100;
    GEO3:     file = "",               start = $DE00,           size = $0100;
    GEO4:     file = "",               start = $DE00,           size = $0100;
    GEO5:     file = "",               start = $DE00,           size = $0100;
    GEO6:     file = "",               start = $DE00,           size = $0100;
    GEO7:     file = "",               start = $DE00,           size = $0100;
    GEO8:     file = "",               start = $DE00,           size = $0100;
    KHI:      file = "%O.khi", define = yes, start = $D000,     size = $1000;
    # overlays per area of the game after the resident KHIRO, the same RAM
    # under the I/O: one file each (%O.ko0, %O.ko1), the program loads the
    # one of the area it enters (RastanRIP ovlc64.s: field / castle)
    KHO0:     file = "%O.ko0", define = yes, start = __KHI_LAST__, size = $E000 - __KHI_LAST__;
    KHO1:     file = "%O.ko1", define = yes, start = __KHI_LAST__, size = $E000 - __KHI_LAST__;
}
SEGMENTS {
    ZEROPAGE: load = ZP,       type = zp;
    RMTZP:    load = ZP,       type = zp,  optional = yes;
    LOADADDR: load = LOADADDR, type = ro;
    EXEHDR:   load = HEADER,   type = ro;
    STARTUP:  load = MAIN,     type = ro;
    LOWCODE:  load = MAIN,     type = ro,  optional = yes;
    CODE:     load = MAIN,     type = ro;
    RODATA:   load = MAIN,     type = ro;
    GAMECODE: load = MAIN,     type = ro,  optional = yes; # atari-rambo.cfg: the RAMbo window
    GAMERODATA: load = MAIN,   type = ro,  optional = yes;
    LOWRODATA: load = MAIN,    type = ro,  optional = yes; # atari-rambo.cfg: below $4000
    RMTTAB:   load = MAIN,     type = ro,  align = $100, optional = yes;
    PSGTAB:   load = MAIN,     type = ro,  align = $100, optional = yes;
    DATA:     load = MAIN,     type = rw;
    INIT:     load = MAIN,     type = rw;  # uninitialized, but reserves output space
    ONCE:     load = MAIN,     type = ro,  define   = yes;
    BSS:      load = BSS,      type = bss, define   = yes;
    XBSS:     load = BSS,      type = bss, define   = yes, optional = yes;
    GAMEBSS:  load = BSS, type = bss, optional = yes;  # game variables, not zeroed (atari-rambo.cfg: in the window)
    COLLBSS:  load = COLL,     type = bss, define   = yes, optional = yes;
    BOOTCODE: load = BOOTOVL,  type = ro,  define   = yes, optional = yes;
    BOOTRODATA: load = BOOTOVL, type = ro, define   = yes, optional = yes;
    GEOPG0:   load = BOOTOVL,  run = GEO0, type = ro, define = yes, optional = yes;
    GEOPG1:   load = BOOTOVL,  run = GEO1, type = ro, define = yes, optional = yes;
    GEOPG2:   load = BOOTOVL,  run = GEO2, type = ro, define = yes, optional = yes;
    GEOPG3:   load = BOOTOVL,  run = GEO3, type = ro, define = yes, optional = yes;
    GEOPG4:   load = BOOTOVL,  run = GEO4, type = ro, define = yes, optional = yes;
    GEOPG5:   load = BOOTOVL,  run = GEO5, type = ro, define = yes, optional = yes;
    GEOPG6:   load = BOOTOVL,  run = GEO6, type = ro, define = yes, optional = yes;
    GEOPG7:   load = BOOTOVL,  run = GEO7, type = ro, define = yes, optional = yes;
    GEOPG8:   load = BOOTOVL,  run = GEO8, type = ro, define = yes, optional = yes;
    KHIRO:    load = KHI,      type = ro,  define   = yes, optional = yes;
    KHOVL0:   load = KHO0,     type = ro,  define   = yes, optional = yes;
    KHOVL1:   load = KHO1,     type = ro,  define   = yes, optional = yes;
    KHMAIN0:  load = KHM0,     type = ro,  define   = yes, optional = yes;
    KHMAIN1:  load = KHM1,     type = ro,  define   = yes, optional = yes;
}
FEATURES {
    CONDES: type    = constructor,
            label   = __CONSTRUCTOR_TABLE__,
            count   = __CONSTRUCTOR_COUNT__,
            segment = ONCE;
    CONDES: type    = destructor,
            label   = __DESTRUCTOR_TABLE__,
            count   = __DESTRUCTOR_COUNT__,
            segment = RODATA;
    CONDES: type    = interruptor,
            label   = __INTERRUPTOR_TABLE__,
            count   = __INTERRUPTOR_COUNT__,
            segment = RODATA,
            import  = __CALLIRQ__;
}
