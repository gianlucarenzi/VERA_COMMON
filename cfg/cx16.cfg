# cx16.cfg - libvera: the cc65 cx16.cfg plus the segments of the RMT player
# (RMTZP zero page, RMTTAB / PSGTAB page aligned tables).  Zero page $22-$7F
# is what the X16 leaves to programs; RAM $0801-$9EFF (the VERA and the
# other I/O are at $9F00).
# XBSS: the large RAM buffers (filled by the program or by SD loads, not
# zeroed at startup) in the banked RAM $A000-$BFFF, bank 1: the one crt0
# selects; libvera never changes RAM_BANK ($00).  HICODE: code there too
# (see below).
FEATURES {
    STARTADDRESS: default = $0801;
}
SYMBOLS {
    __LOADADDR__:  type = import;
    __EXEHDR__:    type = import;
    __STACKSIZE__: type = weak, value = $0800; # 2k stack
    __HIMEM__:     type = weak, value = $9F00;
}
MEMORY {
    ZP:       file = "", define = yes, start = $0022,           size = $0080 - $0022;
    LOADADDR: file = %O,               start = %S - 2,          size = $0002;
    HEADER:   file = %O, define = yes, start = %S,              size = $000D;
    MAIN:     file = %O, define = yes, start = __HEADER_LAST__, size = __HIMEM__ - __HEADER_LAST__;
    BSS:      file = "",               start = __ONCE_RUN__,    size = __HIMEM__ - __STACKSIZE__ - __ONCE_RUN__;
    HIRAM:    file = "", define = yes, start = $A000,           size = $2000;
    HIRAM3:   file = "%O.hi3", define = yes, start = $A000,     size = $2000; # banked RAM bank 3
    # code overlays per area, one at a time in bank 5 (files %O.ko0 / %O.ko1,
    # same names as cfg/c64.cfg): the program loads the one of the area
    KHO0:     file = "%O.ko0", define = yes, start = $A000,     size = $2000;
    KHO1:     file = "%O.ko1", define = yes, start = $A000,     size = $2000;
}
SEGMENTS {
    ZEROPAGE: load = ZP,       type = zp;
    EXTZP:    load = ZP,       type = zp,  optional = yes;
    RMTZP:    load = ZP,       type = zp,  optional = yes;
    LOADADDR: load = LOADADDR, type = ro;
    EXEHDR:   load = HEADER,   type = ro;
    STARTUP:  load = MAIN,     type = ro,  optional = yes;
    LOWCODE:  load = MAIN,     type = ro,  optional = yes;
    CODE:     load = MAIN,     type = ro;
    RODATA:   load = MAIN,     type = ro;
    GAMECODE: load = MAIN,     type = ro,  optional = yes; # atari-rambo.cfg: the RAMbo window
    GAMERODATA: load = MAIN,   type = ro,  optional = yes;
    LOWRODATA: load = MAIN,    type = ro,  optional = yes; # atari-rambo.cfg: below $4000
    RMTTAB:   load = MAIN,     type = ro,  align = $100, optional = yes;
    PSGTAB:   load = MAIN,     type = ro,  align = $100, optional = yes;
    DATA:     load = MAIN,     type = rw;
    INIT:     load = MAIN,     type = rw,  optional = yes; # uninitialized, but reserves output space
    BOOTCODE: load = MAIN,     type = ro,  define   = yes, optional = yes;
    BOOTRODATA: load = MAIN,   type = ro,  define   = yes, optional = yes;
    ONCE:     load = MAIN,     type = ro,  define   = yes;
    BSS:      load = BSS,      type = bss, define   = yes;
    XBSS:     load = HIRAM,    type = bss, define   = yes, optional = yes;
    GAMEBSS:  load = BSS, type = bss, optional = yes;  # game variables, not zeroed (atari-rambo.cfg: in the window)
    # BOOTCODE / BOOTRODATA (optional): code and tables used only at start-up;
    # here in MAIN; COLLBSS in bank 1 with XBSS (no overlay).  COLLBSS (optional): a large buffer that
    # only fills after start-up (RastanRIP: the collision ring)
    COLLBSS:  load = HIRAM,    type = bss, define   = yes, optional = yes;
    # HICODE: code run in bank 1 after XBSS; its image is loaded after ONCE,
    # where the BSS goes, so the program copies it there in a constructor
    # (before zerobss) and it costs no main RAM
    HICODE:   load = MAIN, run = HIRAM, type = ro, define = yes, optional = yes;
    # HIRO3: read-only data for bank 3, written to its own file %O.hi3 (raw,
    # run at $A000): the program loads it into the bank (RastanRIP hiro3.c),
    # so it is not in the PRG; the code that reads it selects bank 3 and
    # gives bank 1 back
    HIRO3:    load = HIRAM3, type = ro, define = yes, optional = yes;
    # KHOVL0 / KHOVL1: code overlays per area, run in bank 5 at $A000 (RastanRIP
    # ovlx16.s loads one and its stubs select bank 5, then give bank 1 back:
    # the overlay reaches the XBSS of bank 1 only through main RAM helpers)
    KHOVL0:   load = KHO0,     type = ro,  define = yes, optional = yes;
    KHOVL1:   load = KHO1,     type = ro,  define = yes, optional = yes;
}
FEATURES {
    CONDES: type    = constructor,
            label   = __CONSTRUCTOR_TABLE__,
            count   = __CONSTRUCTOR_COUNT__,
            segment = ONCE;
    CONDES: type    = destructor,
            label   = __DESTRUCTOR_TABLE__,
            count   = __DESTRUCTOR_COUNT__,
            segment = RODATA;
    CONDES: type    = interruptor,
            label   = __INTERRUPTOR_TABLE__,
            count   = __INTERRUPTOR_COUNT__,
            segment = RODATA,
            import  = __CALLIRQ__;
}
