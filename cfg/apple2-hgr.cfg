# apple2-hgr.cfg - libvera on the Apple IIe with the HGR page 1 ($2000-$3FFF)
# kept free for the screen (LIBVERA_HGR = 1): the program is in two pieces,
# LOW $0900-$1FFF (filled to its end: 23 sectors) and MAIN $4000-$BEFF, in
# this order in the output file.  A boot loader of its own loads them (the
# a2fs boot sector loads one contiguous piece only), then jumps to $0900.
#
# Otherwise as apple2.cfg: zero page $50-$FF, page $BF free (crt0 looks for
# ProDOS there), the language card ($D000-$FFF9) read only for GAMECODE /
# LCCODE / LCRODATA (copied by crt0 from right after ONCE), XBSS after BSS;
# LCOVL after them in the card, loaded by the program (see LCO below);
# AUXCODE in the aux RAM behind the HGR page 1 (see AUX below).
# Nothing that patches itself may go to the language card (sdstream.s, in
# LOWRODATA, does).
FEATURES {
    STARTADDRESS: default = $0900;
}
SYMBOLS {
    __STACKSIZE__: type = weak, value = $0800; # 2k stack
    __HIMEM__:     type = weak, value = $BF00;
    __KHMSIZE__:   type = weak, value = 0;      # KHM0 / KHM1: bytes of the main RAM per area
}
MEMORY {
    ZP:     file = "", define = yes, start = $0050,        size = $00B0;
    LOW:    file = %O, define = yes, start = %S,           size = $2000 - %S, fill = yes;
    MAIN:   file = %O, define = yes, start = $4000,        size = __HIMEM__ - $4000;
    # overlays per area in the main RAM too (KHMAIN0 / KHMAIN1, files %O.km0 /
    # %O.km1, __KHMSIZE__ bytes from where ONCE runs, BSS after them): the
    # program loads them with the KHO one of its area (RastanRIP ovlc64.s,
    # ovlapple.s: after startup, so ONCE's RAM is free again)
    KHM0:   file = "%O.km0", define = yes, start = __ONCE_RUN__, size = __KHMSIZE__;
    KHM1:   file = "%O.km1", define = yes, start = __ONCE_RUN__, size = __KHMSIZE__;
    BSS:    file = "",               start = __ONCE_RUN__ + __KHMSIZE__, size = __HIMEM__ - __STACKSIZE__ - $1000 - __ONCE_RUN__ - __KHMSIZE__;
    # COLL: 4 KB under the C stack for the COLLBSS segment, a buffer that only
    # fills after start-up (RastanRIP: the collision ring); BOOTOVL is the same
    # RAM for the code used only at start-up (BOOTCODE / BOOTRODATA), written
    # to its own file %O.boo: the program loads it there and runs it first
    COLL:   file = "",       define = yes, start = __HIMEM__ - __STACKSIZE__ - $1000, size = $1000;
    BOOTOVL: file = "%O.boo", define = yes, start = __HIMEM__ - __STACKSIZE__ - $1000, size = $1000;
    LC:     file = "", define = yes, start = $D000,        size = $2FFA;
    # the language card's second 4 KB bank ($D000-$DFFF, bank 1): code that
    # runs there with $C088 (read bank 1), stored in the boot overlay and
    # copied by the program at start-up (RastanRIP: the castle vines)
    LC1:    file = "", define = yes, start = $D000,        size = $1000;
    # the rest of the language card for the LCOVL segment: written to its own
    # file %O.lco (raw, run at __LCO_START__), the program loads it from its
    # data (asset_load with the card write enabled) before using it, so it is
    # not in the image the boot loader puts in the main RAM; crt0 copies only
    # the LC area
    LCO:    file = "%O.lco", define = yes, start = __LC_LAST__, size = $FFFA - __LC_LAST__;
    # the IIe aux RAM behind the HGR page 1 ($2000-$3FFF): with 80STORE and
    # HIRES on, PAGE2 ($C055) shows it to the CPU (the screen keeps the main
    # page 1); written to its own file %O.aux, the program loads it (needs
    # the extended 80-column card, 64 KB)
    AUX:    file = "%O.aux", define = yes, start = $2000,        size = $2000;
    # code overlays per area (optional), one at a time in the same aux window
    # right after AUX (files %O.ko0 / %O.ko1, same names as cfg/c64.cfg):
    # the program loads the one of the area (RastanRIP ovlapple.s)
    KHO0:   file = "%O.ko0", define = yes, start = __AUX_LAST__, size = $4000 - __AUX_LAST__;
    KHO1:   file = "%O.ko1", define = yes, start = __AUX_LAST__, size = $4000 - __AUX_LAST__;
}
SEGMENTS {
    ZEROPAGE: load = ZP,             type = zp;
    RMTZP:    load = ZP,             type = zp,  optional = yes;
    STARTUP:  load = LOW,            type = ro;
    LOWCODE:  load = LOW,            type = ro,  optional = yes;
    GAMERODATA: load = LOW,          type = ro,  optional = yes;
    RODATA:   load = LOW,            type = ro;
    LOWRODATA: load = LOW,           type = ro,  optional = yes;
    DATA:     load = LOW,            type = rw;
    INIT:     load = LOW,            type = rw;  # uninitialized, but reserves output space
    CODE:     load = MAIN,           type = ro;
    RMTTAB:   load = MAIN,           type = ro,  align = $100, optional = yes;
    PSGTAB:   load = MAIN,           type = ro,  align = $100, optional = yes;
    ONCE:     load = MAIN,           type = ro,  define   = yes;
    GAMECODE: load = MAIN, run = LC, type = ro,  optional = yes; # right after ONCE (crt0)
    LCCODE:   load = MAIN, run = LC, type = ro,  optional = yes;
    LCRODATA: load = MAIN, run = LC, type = ro,  optional = yes;
    LCOVL:    load = LCO,            type = ro,  optional = yes; # loaded by the program
    AUXCODE:  load = AUX,            type = ro,  define = yes, optional = yes; # aux RAM window, loaded by the program
    AUXRODATA: load = AUX,           type = ro,  define = yes, optional = yes; # tables read with PAGE2 on (RastanRIP: rastab)
    AUXBSS:   load = AUX,            type = bss, define = yes, optional = yes; # after it, not in the file
    KHOVL0:   load = KHO0,           type = ro,  define = yes, optional = yes; # overlays per area (PAGE2 on)
    KHOVL1:   load = KHO1,           type = ro,  define = yes, optional = yes;
    KHMAIN0:  load = KHM0,     type = ro,  define   = yes, optional = yes;
    KHMAIN1:  load = KHM1,     type = ro,  define   = yes, optional = yes;
    BSS:      load = BSS,            type = bss, define   = yes;
    XBSS:     load = BSS,            type = bss, define   = yes, optional = yes;
    GAMEBSS:  load = BSS, type = bss, optional = yes;  # game variables, not zeroed (atari-rambo.cfg: in the window)
    COLLBSS:  load = COLL,           type = bss, define   = yes, optional = yes;
    BOOTCODE: load = BOOTOVL,        type = ro,  define   = yes, optional = yes;
    LC1CODE:  load = BOOTOVL, run = LC1, type = ro, define = yes, optional = yes;
    BOOTRODATA: load = BOOTOVL,      type = ro,  define   = yes, optional = yes;
}
FEATURES {
    CONDES: type    = constructor,
            label   = __CONSTRUCTOR_TABLE__,
            count   = __CONSTRUCTOR_COUNT__,
            segment = ONCE;
    CONDES: type    = destructor,
            label   = __DESTRUCTOR_TABLE__,
            count   = __DESTRUCTOR_COUNT__,
            segment = RODATA;
    CONDES: type    = interruptor,
            label   = __INTERRUPTOR_TABLE__,
            count   = __INTERRUPTOR_COUNT__,
            segment = RODATA,
            import  = __CALLIRQ__;
}
